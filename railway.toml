# Railway config-as-code — servicio `paperclip` (orquestación agentic + Codex CLI)
# Cómo se usa en Railway:
#   - Source: repo adminLynere/paperclip (sustituye a la imagen tuyenvd/paperclip).
#   - Service Root Directory: "/" (el Dockerfile hace FROM tuyenvd/paperclip y añade
#     Node 22 + @openai/codex; el build context es la raíz del repo).
#   - Config-as-code path: "railway.toml" (Settings → Config).
#
# Backend de modelo = OpenRouter (ver ./Dockerfile y ./README.md). Variable REQUERIDA del
# servicio (Settings → Variables):
#   OPENROUTER_API_KEY = <key de openrouter.ai/keys>   # secreto; Codex lo lee en runtime
# Opcional: cambiar de modelo = rebuild con --build-arg CODEX_MODEL=<slug de openrouter>.
#
# Volumen: el antiguo `paperclip-volume` en /root/.codex existía SOLO para persistir el
# login device-auth de Codex (auth.json). Con OpenRouter por env var ya no hay auth.json,
# así que ese volumen puede DESMONTARSE/eliminarse. La config de Codex se hornea en la
# imagen (CODEX_HOME=/opt/codex), inmune a volúmenes. Si persistes datos de Paperclip,
# usa un mountPath distinto (p.ej. el que indique su imagen), no /opt/codex.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
# Paperclip orquesta a los agentes y debe estar SIEMPRE ON (sin App Sleeping):
# los heartbeats/cron de los agentes no deben pausarse. Contrasta con api/web/keycloak,
# que sí duermen.
sleepApplication = false
